<head class="header">
    <h1>Cadastro de Cartões</h1>

    <div class="user-area">
        <span class="user-name">Olá, usuário</span>
        <i class="fa-solid fa-circle-user"></i>
    </div>

</head>

<main class="content">
    <div class="card">
        <h2>Novo cartão</h2>

        <form class="form">

            <div class="form-group">
                <label for="nome">Nome do Cartão: *</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Meu Cartão" />
            </div>

            <div class="form-group">
                <label for="bandeira">Bandeira: *</label>
                <select>
                    <option>Selecione</option>
                    <option>Visa</option>
                    <option>Mastercard</option>
                    <option>American Express</option>
                    <option>Dinners</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submite" class="btn-primary">Salvar</button>
                <button type="submite" class="btn-secondary">Cancelar</button>
            </div>

        </form>


    </div>

</main>
